
- name: Балансьор
  hosts: lb
  become: true
  tasks:
    - name: Инсталирай nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Постави конфигурацията на nginx от шаблон
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/default
      notify: Reload nginx

    - name: Пусни и включи nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded